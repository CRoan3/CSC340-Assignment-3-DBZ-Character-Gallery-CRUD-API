spring.application.name=dbz-api
# Set this as an environment variable locally and on Render:
#   SPRING_DATASOURCE_URL="jdbc:postgresql://<neon-host>/<db>?user=...&password=...&sslmode=require"
# Spring Boot reads it automatically, so nothing secret lives in this file.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uncomment to see the SQL Hibernate runs
#logging.level.org.hibernate.SQL=DEBUG

server.port=${PORT:8080}
